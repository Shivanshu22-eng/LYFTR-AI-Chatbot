services:
  - type: web
    name: lyftr-ai-chatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: lyftr-sqlite-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/lyftr.db
      - key: LITELLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: LLM_API_KEYS
        sync: false
      - key: CORS_ORIGINS
        value: https://frontend-nu-jade-29.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "True"
